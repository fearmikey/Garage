Name: Garage
Summary: Modern, privacy-focused vehicle management app
Description: |-
  Garage is a modern, privacy-focused, comprehensive vehicle management application
  for Android. Garage enables vehicle owners to track maintenance schedules, monitor fuel
  efficiency, analyze cost of ownership, check safety recalls, and maintain detailed
  service records for all their vehicles in one centralized hub.

  Features:
  - Track service history & maintenance schedule
  - VIN decoding & specifications lookup
  - Fuel economy & fill-up tracking
  - Privacy focused & 100% offline-first functionality
  - Detailed cost of ownership analytics
  - Safety recall alerts & reminders
  - WebDAV cloud backup support

